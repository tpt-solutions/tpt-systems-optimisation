[workspace]
resolver = "2"
members = [
    "crates/*",
    "deps/*",
    "xtask",
]
exclude = [
    "examples",
]

[workspace.package]
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
homepage = "https://github.com/tpt-solutions/tpt-systems-optimisation"
repository = "https://github.com/tpt-solutions/tpt-systems-optimisation"
readme = "README.md"

[workspace.dependencies]
# Internal optimisation crates
tpt-opt-core = { path = "crates/tpt-opt-core", version = "0.1.0" }
tpt-opt-milp = { path = "crates/tpt-opt-milp", version = "0.1.0" }
tpt-opt-minlp = { path = "crates/tpt-opt-minlp", version = "0.1.0" }
tpt-opt-network = { path = "crates/tpt-opt-network", version = "0.1.0" }
tpt-opt-cp = { path = "crates/tpt-opt-cp", version = "0.1.0" }
tpt-opt-heuristic = { path = "crates/tpt-opt-heuristic", version = "0.1.0" }
tpt-opt-multi = { path = "crates/tpt-opt-multi", version = "0.1.0" }
tpt-opt-robust = { path = "crates/tpt-opt-robust", version = "0.1.0" }
tpt-opt-decompose = { path = "crates/tpt-opt-decompose", version = "0.1.0" }
tpt-opt-conic = { path = "crates/tpt-opt-conic", version = "0.1.0" }
tpt-opt-systems = { path = "crates/tpt-opt-systems", version = "0.1.0" }

# Published `tpt-math` crates (crates.io). The optimisation crates now depend
# on these directly. Sparse matrices come from `tpt-math-linalg-sparse`
# (the original shims named the sparse crate `tpt-math-linalg`); `tpt-math-numeric`
# / `tpt-math-linalg-complex` shims are no longer required (the only shim helper
# the solvers used, `is_integer`, is now defined locally in `tpt-opt-core`).
tpt-math-linalg-sparse = "0.1.0"
tpt-math-graph = "0.1.0"
tpt-math-prob = "0.1.0"
tpt-math-optimize-convex = "0.1.0"
tpt-math-optimize-general = "0.1.0"

# Common external dependencies
thiserror = "2.0"
# `default-features = false` keeps dependents no_std-compatible; members may
# opt back into std explicitly if ever needed.
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[profile.release]
opt-level = 3
lto = "thin"
