[package]
name = "tpt-opt-systems"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Umbrella crate for the tpt optimisation suite: one dependency, flat per-solver feature gates, unified errors, and convenience builders."
keywords = ["optimization", "solver", "umbrella", "milp", "multi-objective"]
categories = ["science::math", "algorithms"]
documentation = "https://docs.rs/tpt-opt-systems"

# docs.rs builds with every solver family enabled so the feature-gated
# re-exports, builders, and conversion utilities are all documented.
[package.metadata.docs.rs]
all-features = true

[dependencies]
    tpt-opt-core = { workspace = true }
    tpt-opt-milp = { workspace = true, optional = true }
    tpt-opt-minlp = { workspace = true, optional = true }
    tpt-opt-network = { workspace = true, optional = true }
    tpt-opt-cp = { workspace = true, optional = true }
    tpt-opt-heuristic = { workspace = true, optional = true }
    tpt-opt-multi = { workspace = true, optional = true }
    tpt-opt-robust = { workspace = true, optional = true }
    tpt-opt-decompose = { workspace = true, optional = true }
    tpt-opt-conic = { workspace = true, optional = true }
    tpt-opt-nls = { workspace = true, optional = true }
    tpt-opt-factorgraph = { workspace = true, optional = true }
    tpt-opt-bayes = { workspace = true, optional = true }
    serde_json = { version = "1.0", optional = true }
    tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }

[features]
default = ["std"]
std = []
# Serde derives on the canonical model, solution, and parameter types
# (JSON model import/export, warm-start caching). Forwards to `tpt-opt-core`.
serde = ["tpt-opt-core/serde", "dep:serde_json"]
# Structured spans and events (via `tracing`) around the auto-dispatch solve.
# Off by default so the dependency is opt-in.
tracing = ["dep:tracing"]

# ---- One flat feature per solver crate -----------------------------------
# Mixed-integer linear programming (branch-and-bound/cut).
milp = ["dep:tpt-opt-milp"]
# Mixed-integer nonlinear programming (outer approximation, GBD, SQP-B&B).
minlp = ["dep:tpt-opt-minlp"]
# Network flows, assignment, OPF, graph preprocessing.
network = ["dep:tpt-opt-network"]
# Constraint programming (propagation + backtracking search).
cp = ["dep:tpt-opt-cp"]
# Metaheuristics (annealing, GA, tabu, PSO).
heuristic = ["dep:tpt-opt-heuristic"]
# Multi-objective / Pareto (NSGA-II/III, hypervolume, scalarisation).
multi = ["dep:tpt-opt-multi"]
# Optimisation under uncertainty (stochastic, robust, DRO, chance).
robust = ["dep:tpt-opt-robust"]
# Large-scale decomposition (Benders, Dantzig-Wolfe, branch-and-price,
# Lagrangian).
decompose = ["dep:tpt-opt-decompose"]
# Conic (second-order-cone / semidefinite) optimisation via Kelley cutting
# planes.
conic = ["dep:tpt-opt-conic"]
# Nonlinear least squares (Gauss-Newton / Levenberg-Marquardt / dogleg,
# autodiff, robust losses, sparse normal equations).
nls = ["dep:tpt-opt-nls"]
# Factor-graph / SLAM least squares (pose graphs, bundle adjustment);
# implies `nls` for the shared sparse/autodiff machinery.
factorgraph = ["dep:tpt-opt-factorgraph", "nls"]
# Bayesian optimisation (GP surrogate, expected improvement).
bayes = ["dep:tpt-opt-bayes"]

# Convenience meta-feature enabling every solver family at once.
all-solvers = [
    "milp",
    "minlp",
    "network",
    "cp",
    "heuristic",
    "multi",
    "robust",
    "decompose",
    "conic",
    "nls",
    "factorgraph",
    "bayes",
]
# Runnable examples. Each names the feature it needs so that a plain
# `cargo test` (which builds examples) skips it instead of failing.
[[example]]
name = "network_min_cost_flow"
required-features = ["network"]

[[example]]
name = "nls_exponential_fit"
required-features = ["nls"]

[[example]]
name = "conic_socp"
required-features = ["conic"]

[[example]]
name = "mps_loading"
required-features = ["milp"]

[[example]]
name = "bayes_minimise"
required-features = ["bayes"]

[[example]]
name = "factorgraph_square_loop"
required-features = ["factorgraph"]
