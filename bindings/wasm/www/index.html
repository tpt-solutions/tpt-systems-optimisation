<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tpt-opt in the browser</title>
  <style>
    :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fff; --muted: #6e6e73; --line: #d2d2d7; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #1c1c1e; --muted: #98989d; --line: #3a3a3c; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 820px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 0.4rem 0; }
    p.muted { color: var(--muted); margin: 0.2rem 0 1rem; }
    textarea { width: 100%; box-sizing: border-box; min-height: 220px; font: 13px/1.4 ui-monospace, monospace;
      color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
    select, input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
    pre { white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-height: 3em; margin: 0; }
  </style>
</head>
<body>
<main>
  <h1>tpt-opt in the browser</h1>
  <p class="muted">A mixed-integer solver compiled to WebAssembly. The model is solved on this page; nothing is sent to a server.</p>

  <div class="row">
    <label>Format
      <select id="format">
        <option value="lp" selected>CPLEX LP</option>
        <option value="mps">MPS</option>
      </select>
    </label>
    <label>Time limit (s)
      <input id="limit" type="number" min="0.1" step="0.1" value="5" style="width:6em">
    </label>
    <button id="solve" disabled>Solve</button>
    <span id="version" class="muted"></span>
  </div>

  <textarea id="model" spellcheck="false">\ Knapsack: maximise value under a weight limit.
Maximize
 obj: 5 x + 4 y + 3 z
Subject To
 weight: 4 x + 3 y + 2 z <= 7
Bounds
 0 <= x <= 1
 0 <= y <= 1
 0 <= z <= 1
General
 x y z
End
</textarea>

  <h3>Result</h3>
  <pre id="result">Loading the solver…</pre>
</main>

<script type="module">
  import init, { solve, version } from "./pkg/tpt_opt_wasm.js";

  const result = document.getElementById("result");
  const button = document.getElementById("solve");

  try {
    await init();
    document.getElementById("version").textContent = "solver v" + version();
    result.textContent = "Ready.";
    button.disabled = false;
  } catch (err) {
    result.textContent = "Could not load the WebAssembly module: " + err;
  }

  button.addEventListener("click", () => {
    const format = document.getElementById("format").value;
    const limit = parseFloat(document.getElementById("limit").value);
    const text = document.getElementById("model").value;
    try {
      const json = solve(text, format, Number.isFinite(limit) && limit > 0 ? limit : undefined);
      result.textContent = JSON.stringify(JSON.parse(json), null, 2);
    } catch (err) {
      result.textContent = "Error: " + err;
    }
  });
</script>
</body>
</html>
