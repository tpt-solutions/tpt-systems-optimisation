[package]
name = "tpt-opt-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Canonical optimisation problem representation + Solver trait contract (no_std + alloc)."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["optimization", "solver", "milp", "linear-programming", "no-std"]
categories = ["science::math", "algorithms", "mathematics"]
documentation = "https://docs.rs/tpt-opt-core"

[dependencies]
tpt-math-linalg-sparse = { workspace = true }
serde = { workspace = true, optional = true }
# Optional dependency backing the in-crate augmented-Lagrangian NLP solver
# (`nlp` module) used by `tpt-opt-minlp` and `tpt-opt-network`'s AC-OPF.
tpt-math-optimize-general = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
# Augmented-Lagrangian constrained-NLP solver (`solve_nlp`/`NlpProblem`),
# vendored locally because the published `tpt-math-optimize-general` only
# exposes unconstrained minimizers. Implies `alloc` (uses `Vec`).
nlp = ["dep:tpt-math-optimize-general", "alloc"]
# Serialize/Deserialize derives on the canonical model, solution, parameters,
# tolerances, and error types (warm-start caching, reproducible bug reports).
# `default-features = false` keeps the crate no_std-compatible with the
# feature on; note that JSON cannot represent ±inf bounds (see bounds.rs).
serde = ["dep:serde", "alloc"]
