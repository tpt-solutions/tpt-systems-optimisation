name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test + doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
      - uses: taiki-e/install-action@cargo-nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc

  no-std:
    name: no_std build (thumbv6m-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
        with:
          targets: thumbv6m-none-eabi
      # Only crates the spec marks no_std-compatible are checked here; the
      # rest of the workspace requires std (HiGHS bindings, file IO, ...).
      - run: cargo check -p tpt-opt-core --target thumbv6m-none-eabi --no-default-features
      - run: cargo check -p tpt-opt-core --target thumbv6m-none-eabi --no-default-features --features alloc

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  feature-powerset:
    name: feature-powerset (umbrella)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack --package tpt-opt-systems --feature-powerset --no-dev-deps check

  tier2:
    name: Tier 2 feature combinations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "milp,network,robust"
          - "milp,cp,multi,heuristic"
          - "minlp,decompose,multi"
          - "cp,milp,multi"
          - "network,robust"
          - "multi,heuristic"
          - "milp,cp"
          - "milp,network"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
      - run: cargo check -p tpt-opt-systems --no-default-features --features "${{ matrix.features }}"

  msrv:
    name: MSRV build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
      - run: cargo build --workspace --all-features

  semver-checks:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  bench-smoke:
    name: bench compile-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
      - run: cargo bench --workspace --no-run

  perf-report:
    # Non-blocking performance report: solves a fixed instance set and prints
    # timings for eyeballing regressions. Never gates merges — timing varies
    # across runners.
    name: perf report (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
      - run: cargo test -p tpt-opt-milp --test perf_regression -- --ignored --nocapture

  benchmark-corpus:
    # Fetch the curated Netlib/MIPLIB fixtures via xtask (outside every crate
    # directory, gitignored, never packaged) and run the corpus integration
    # tests against the published optima. Non-blocking: the downloads come
    # from third-party mirrors and may flake independently of code health.
    name: benchmark corpus (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.84
      - run: cargo xtask fetch-fixtures
      - run: cargo test -p tpt-opt-milp --test benchmark_corpus -- --nocapture
