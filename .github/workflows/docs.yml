name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: rustdoc + mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      # Warnings are errors so broken intra-doc links fail the build.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
      - uses: taiki-e/install-action@mdbook
      - name: mdBook
        run: mdbook build docs
      - name: assemble site
        run: |
          mkdir -p site
          cp -r target/doc site/api
          cp -r docs/book site/book
          printf '%s\n' '<meta http-equiv="refresh" content="0; url=book/">' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
