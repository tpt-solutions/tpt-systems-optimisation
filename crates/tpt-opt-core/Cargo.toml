[package]
name = "tpt-opt-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Canonical optimisation problem representation + Solver trait contract (no_std + alloc)."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["optimization", "solver", "milp", "linear-programming", "no-std"]
categories = ["science::math", "algorithms", "mathematics"]
documentation = "https://docs.rs/tpt-opt-core"

[dependencies]
# Not `workspace = true`: cargo ignores `default-features` on inherited
# dependencies. The published sparse crate defaults to `std`, which pulls
# `num-traits/std` and breaks the no_std (`thumbv6m-none-eabi`) build. The
# `std` feature below forwards it back on for host builds.
tpt-math-linalg-sparse = { version = "0.2.0", default-features = false }
# `no_std` float math (`sqrt`, `ln`, `exp`, ...); see `src/math.rs`. Already in
# the lockfile via `num-traits`.
libm = "0.2"
serde = { workspace = true, optional = true }
# Optional dependency backing the in-crate augmented-Lagrangian NLP solver
# (`nlp` module) used by `tpt-opt-minlp` and `tpt-opt-network`'s AC-OPF. The
# published crate ships only *unconstrained* minimizers; `solve_nlp` drives the
# outer augmented-Lagrangian loop and uses its conjugate-gradient solver for the
# inner subproblem.
tpt-math-optimize-general = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["std"]
std = ["alloc", "tpt-math-linalg-sparse/std"]
alloc = ["tpt-math-linalg-sparse/alloc"]
# Augmented-Lagrangian constrained-NLP solver (`solve_nlp`/`NlpProblem`). Its
# inner subproblem uses the conjugate-gradient minimizer from
# `tpt-math-optimize-general` as the primary solver, with a self-contained BFGS
# fallback kept in-crate (the published crate only exposes unconstrained
# minimizers). Implies `alloc` (uses `Vec`).
nlp = ["dep:tpt-math-optimize-general", "alloc"]
# Serialize/Deserialize derives on the canonical model, solution, parameters,
# tolerances, and error types (warm-start caching, reproducible bug reports).
# `default-features = false` keeps the crate no_std-compatible with the
# feature on; note that JSON cannot represent ±inf bounds (see bounds.rs).
serde = ["dep:serde", "alloc"]
