[package]
name = "tpt-opt-robust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Optimisation under uncertainty: stochastic programming, SAA, adjustable robust optimisation, chance constraints, DRO"
readme = "README.md"
keywords = ["robust-optimization", "stochastic", "chance-constraint", "optimization", "uncertainty"]
categories = ["science::math", "algorithms"]
documentation = "https://docs.rs/tpt-opt-robust"

[dependencies]
    tpt-opt-core = { workspace = true }
    tpt-opt-milp = { workspace = true }
    tpt-math-optimize-convex = { workspace = true }
    tpt-math-prob = { workspace = true }
    tpt-math-linalg = { workspace = true }

[features]
default = ["std"]
std = []
